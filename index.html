<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho tài liệu Logistics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            color: #2563eb;
        }

        .search {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 20px;
            margin-top: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

    <h1>📚 Kho tài liệu Logistics</h1>

    <input class="search" type="text" placeholder="Tìm kiếm tài liệu...">

    <div class="card">
        <h3>🚢 Quy trình Booking</h3>
        <p>Hướng dẫn làm booking với hãng tàu.</p>
    </div>

    <div class="card">
        <h3>📦 Thủ tục Hải quan</h3>
        <p>Quy trình khai báo và thông quan.</p>
    </div>

    <div class="card">
        <h3>📄 Biểu mẫu</h3>
        <p>Invoice, Packing List, Debit Note...</p>
    </div>

</body>
</html>
